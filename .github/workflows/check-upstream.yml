name: Check upstream Postgres

# Fully automatic: when official postgres MAJOR.MINOR (or its digest) changes,
# update versions.env on main → existing build-push workflow publishes images.
on:
  schedule:
    # Daily 03:17 UTC — offset from the hour to reduce Hub/API thundering herds.
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: check-upstream
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump:
    name: Bump postgres base if needed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need full history only for push race recovery; shallow is fine.
          fetch-depth: 0
          # Use the default token with contents:write to push back to main.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check and bump versions.env
        id: bump
        run: |
          set -euo pipefail
          chmod +x scripts/check-and-bump-postgres.sh
          ./scripts/check-and-bump-postgres.sh

      - name: Commit and push
        if: steps.bump.outputs.changed == 'true'
        env:
          NEW_TAG: ${{ steps.bump.outputs.latest_tag }}
          NEW_IMAGE: ${{ steps.bump.outputs.new_image }}
          PREV_IMAGE: ${{ steps.bump.outputs.previous_image }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add versions.env
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi

          git commit -m "chore: bump postgres base to ${NEW_TAG}" \
            -m "${PREV_IMAGE} -> ${NEW_IMAGE}" \
            -m "Auto-detected by check-upstream workflow (no PR)."

          # Rebase if another commit landed; then push to trigger build-push.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "pushed bump for ${NEW_TAG}"
              exit 0
            fi
            echo "push failed (attempt ${attempt}), rebasing..."
            git pull --rebase origin main
          done
          echo "failed to push after retries" >&2
          exit 1

      - name: Summary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Upstream Postgres check

          | Field | Value |
          | --- | --- |
          | Changed | \`${{ steps.bump.outputs.changed }}\` |
          | Latest tag | \`${{ steps.bump.outputs.latest_tag }}\` |
          | New image | \`${{ steps.bump.outputs.new_image }}\` |
          | Previous | \`${{ steps.bump.outputs.previous_image }}\` |
          EOF
